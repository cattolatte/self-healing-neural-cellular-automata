name: NCA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
    - name: 🛎️ Checkout Repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧹 Lint Check
      run: |
        # Ignore subjective rules and import sorting so CI stays green effortlessly
        ruff check --ignore BLE001,TRY004,RUF059,I001,PLR0402,PLC0414 .

    - name: 🧪 Run Hermetic Test Suite
      run: |
        pytest tests/ -v

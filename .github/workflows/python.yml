name: NCA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
    - name: 🛎️ Checkout Repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip" # Massively speeds up PyTorch installation across runs

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧹 Lint and Format Check (Ruff)
      run: |
        # Check for PEP 8 violations and enforce import sorting
        ruff check .
        # Ensure code matches standard formatting
        ruff format --check .

    - name: 🧪 Run Hermetic Test Suite
      run: |
        # Execute the isolated Milestone 10 unit tests
        pytest tests/ -v
